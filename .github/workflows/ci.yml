name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  GO_BIN: go

jobs:
  verify:
    name: Local Gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Whitespace check
        run: git diff --check

      - name: Dependency metadata
        run: scripts/verify-deps.sh

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test -count=1 ./...

      - name: Focused race tests
        run: go test -race -count=1 ./internal/eventlog ./internal/gateway ./internal/telegrambot ./internal/tools ./internal/tui ./internal/clientux/projector

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Strict hygiene
        run: go run ./cmd/fast-agent-harness hygiene -repo "$GITHUB_WORKSPACE" -strict

      - name: Benchmark smoke
        run: scripts/bench-smoke.sh
        env:
          BENCHTIME: 1x

  full-race:
    name: Full Race
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Full race test suite
        run: go test -race -count=1 ./...
